name: haru-simulator

services:
  unity-app:
    image: haru/haru-simulator:local
    command: ["/bin/bash", "-c", "export ROS_IP=$(hostname -I | awk '{print $1}') && ros2 launch haru_unity unity_app_launcher_launch.py && tail -f /dev/null"]
    env_file: .env.example
    network_mode: host
    ipc: host
    devices:
      - /dev/snd
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  
  web-server:
    image: haru/haru-simulator:local
    working_dir: /app/haru2_web
    command: ["/bin/bash", "-c", "bash run_web.sh"]
    env_file: .env.example
    network_mode: host
    ipc: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
